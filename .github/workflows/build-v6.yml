name: Build Dual Translate v6 APK

on:
  push:
    branches: [ dual-translate-v6-build ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 35 platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Reconstruct v6 source
        run: |
          cat v6small/chunk* > DualTranslate_v6_project.b64
          test "$(wc -c < DualTranslate_v6_project.b64)" = "49680"
          base64 -d DualTranslate_v6_project.b64 > DualTranslate_v6_project.zip
          echo "fdc35c6aaf5ca3f0d14be9be0e81d1ff5fa06bee5fe5bd0ac0de43936c56e2f2  DualTranslate_v6_project.zip" | sha256sum -c -
          rm -rf buildsrc
          mkdir buildsrc
          unzip -q DualTranslate_v6_project.zip -d buildsrc

      - name: Build debug APK
        working-directory: buildsrc
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DualTranslate-v6-apk
          path: buildsrc/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
